seed: 2026
device: auto
data:
  root: data/processed/hmdd_v4
  target_relation: MDA
  target_aliases: [MDA, miRNA_disease, microRNA_disease_association]
  hops: 3
  max_neighbors: 32
  demonstrations: 8
model:
  feature_dim: 768
  relation_feature_dim: 768
  hidden_dim: 256
  num_node_types: 8
  relation_layers: 2
  entity_layers: 4
  verifier_hidden_dim: 128
  dropout: 0.1
training:
  epochs: 100
  batch_size: 128
  max_edges_per_epoch: null
  learning_rate: 0.0002
  weight_decay: 0.0001
  negative_ratio: 4
  gradient_clip: 1.0
  patience: 10
  lambda_rank: 0.5
  lambda_cf: 0.2
  lambda_cal: 0.1
evaluation:
  budgets: [1, 2, 4, 8, 16]
  default_budget: 8
  verifier_temperature: 1.0
  hits: [10, 50]
  ndcg_k: 50
  seeds: [2022, 2023, 2024, 2025, 2026]
