seed: 7
device: cpu
data:
  root: data/processed/toy
  target_relation: MDA
  target_aliases: [MDA, miRNA_disease]
  hops: 3
  max_neighbors: 8
  demonstrations: 1
model:
  feature_dim: 32
  relation_feature_dim: 24
  hidden_dim: 32
  num_node_types: 5
  relation_layers: 2
  entity_layers: 2
  verifier_hidden_dim: 16
  dropout: 0.1
training:
  epochs: 1
  batch_size: 2
  max_edges_per_epoch: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  negative_ratio: 1
  gradient_clip: 1.0
  patience: 2
  lambda_rank: 0.5
  lambda_cf: 0.0
  lambda_cal: 0.1
evaluation:
  budgets: [1, 2]
  default_budget: 2
  verifier_temperature: 1.0
  hits: [1, 3]
  ndcg_k: 3
  seeds: [7]
