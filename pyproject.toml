[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtrmda"
version = "0.1.0"
description = "Graph in-context reasoning with test-time verification for relation-level zero-shot MDA prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anonymous AAAI submission"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
encoders = ["transformers>=4.42"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["gtrmda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
